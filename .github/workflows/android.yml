name: Android app

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read

# Only a pull request's newest commit is worth testing. On main a run in progress finishes,
# and the newest push waits for it, then compares with the nearest main commit whose run
# passed (scripts/ci-changes.mjs).
concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select Android tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.select.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
      - run: node --test scripts/ci-changes.test.mjs
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-changes.mjs android.yml

  # The runner's Android SDK has the platform the app compiles against and the build tools AGP
  # uses; AGP would download either if an image lacked it.
  build:
    name: Core tests, lint and build
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # The generated Kotlin contract, with the web and iPhone ones.
      - run: npm run test:contract
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-provider: basic
      - name: Test the core in UTC
        working-directory: android
        env:
          TEST_TIME_ZONE: UTC
        run: ./gradlew :core:test
      - name: Test the core in Zurich
        working-directory: android
        env:
          TEST_TIME_ZONE: Europe/Zurich
        run: ./gradlew :core:test
      - name: Lint and build the app and the core's device tests
        working-directory: android
        run: ./gradlew :app:lintDebug :app:assembleDebug :coredevice:lintDebug :coredevice:assembleDebugAndroidTest
      - name: Keep the reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-core-and-lint-reports
          path: |
            android/core/build/reports/tests/
            android/core/build/test-results/
            android/app/build/reports/lint-results-debug.*
            android/coredevice/build/reports/lint-results-debug.*
          retention-days: 7

  # The screenshots are recorded on a Mac with Apple silicon. Robolectric's graphics draw text
  # edges and blurs a little differently on Linux x86-64, so they are checked on the same platform.
  # verifyRoborazziDebug runs the app's unit tests with the screenshots checked.
  screenshots:
    name: App tests and screenshots
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-provider: basic
      - name: Test the app and check its screenshots
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:verifyRoborazziDebug
      # A screenshot that differs leaves <name>_actual.png and <name>_compare.png in outputs/roborazzi.
      - name: Keep the reports and screenshot differences
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-app-reports
          path: |
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/test-results/
            android/app/build/outputs/roborazzi/
            android/app/build/reports/roborazzi/
          retention-days: 7

  # What R8 breaks shows only when the shrunk app runs (a constructor made by reflection, a serializer). The release
  # build, signed with a key made for the run and pointed at made-up servers, is opened on an emulator and must stay up.
  release:
    name: Release build opens
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-provider: basic
      - name: Make a throwaway upload key and release settings
        run: |
          dir="$RUNNER_TEMP/release"
          mkdir -p "$dir"
          pass=$(openssl rand -hex 16)
          keytool -genkeypair -keystore "$dir/upload.jks" -alias upload -keyalg RSA -keysize 2048 -validity 2 \
            -storepass "$pass" -keypass "$pass" -dname "CN=Release smoke test"
          printf 'storeFile=upload.jks\nstorePassword=%s\nkeyAlias=upload\nkeyPassword=%s\n' "$pass" "$pass" > "$dir/upload.properties"
          cat > "$dir/release.xcconfig" <<'XCCONFIG'
          SDT_USE_API = YES
          SDT_API_BASE_URL = https:/$()/peek.invalid
          SDT_SUPABASE_URL = https:/$()/supabase.peek.invalid
          SDT_SUPABASE_PUBLISHABLE_KEY = synthetic-publishable-key
          SDT_GOOGLE_AUTH_ENABLED = NO
          XCCONFIG
      # Without Gradle and Kotlin daemons left from the build, their heaps grown by R8, to share the memory with the emulator.
      - name: Build the release APK
        working-directory: android
        run: >-
          ./gradlew :app:assembleRelease --no-daemon
          -Pkotlin.compiler.execution.strategy=in-process
          "-Ppeek.uploadProperties=$RUNNER_TEMP/release/upload.properties"
          "-Ppeek.releaseXcconfig=$RUNNER_TEMP/release/release.xcconfig"
      - name: Enable KVM
        run: |
          free -m
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Open it on an emulator
        timeout-minutes: 15
        env:
          SMOKE_LOGCAT: ${{ runner.temp }}/smoke-logcat.txt
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          # SwiftShader through ANGLE: the older swiftshader_indirect, unmaintained, stops the emulator as the app draws.
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -no-snapshot
          script: android/scripts/release-smoke.sh android/app/build/outputs/apk/release/app-release.apk
      - name: Show the memory and the end of the device's log
        if: failure()
        run: |
          free -m
          sudo dmesg | grep -i -E 'out of memory|killed process' || echo "The system stopped nothing for memory."
          tail -n 150 "$RUNNER_TEMP/smoke-logcat.txt" || true
      - name: Keep the device's log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release-logcat
          path: ${{ runner.temp }}/smoke-logcat.txt
          if-no-files-found: ignore
          retention-days: 7
