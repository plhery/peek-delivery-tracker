name: Nightly release POC

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish signed artifacts (also requires repository opt-in and release environment)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# Shared with stable: keep the frozen plan, build and publication serialized.
concurrency:
  group: peek-release-poc
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'schedule' || vars.PEEK_RELEASE_PUBLISH_ENABLED == 'true'
    uses: ./.github/workflows/release-build.yml
    with:
      channel: nightly
      publish: ${{ (github.event_name == 'schedule' && vars.PEEK_RELEASE_PUBLISH_ENABLED == 'true') || inputs.publish == true }}
    secrets: inherit
  publish:
    needs: build
    if: needs.build.outputs.skip != 'true' && ((github.event_name == 'schedule' && vars.PEEK_RELEASE_PUBLISH_ENABLED == 'true') || inputs.publish == true)
    permissions:
      contents: write
      actions: read
      packages: write
    uses: ./.github/workflows/release-publish.yml
