name: Publish opted-in release

on:
  workflow_call:

permissions:
  contents: write
  actions: read
  packages: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && vars.PEEK_RELEASE_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: peek-release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: signed-release-candidates
          path: release-assets
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish complete matrix and repair aliases
        env:
          GH_TOKEN: ${{ github.token }}
          PEEK_PUBLISH_ENABLED: ${{ vars.PEEK_RELEASE_PUBLISH_ENABLED }}
        run: node scripts/release/publish.mjs
