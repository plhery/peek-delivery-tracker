name: Stable release POC

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version matching the committed root package version
        type: string
        required: true
      source_sha:
        description: Full main-history SHA (empty freezes current main)
        type: string
        default: ''
      publish:
        description: Publish signed artifacts (also requires repository opt-in and release environment)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: peek-release-poc
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/release-build.yml
    with:
      channel: stable
      version: ${{ inputs.version }}
      source_sha: ${{ inputs.source_sha }}
      publish: ${{ inputs.publish }}
    secrets: inherit
  publish:
    needs: build
    if: inputs.publish && needs.build.outputs.skip != 'true'
    permissions:
      contents: write
      actions: read
      packages: write
    uses: ./.github/workflows/release-publish.yml
